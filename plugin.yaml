name: grok-bot-twin
label: Grok Bot Twin
version: "0.3.5"
description: >-
  Gives each bot from the Grok desktop app a twin in Hermes: a Hermes bot that follows its name and description.
  It runs botport (your own verified download), reads the Grok app's bot list, writes mainly in your Hermes
  folder and, only if you share twins, talks to your other computers. Unofficial; not affiliated with xAI.
  Disclosure: docs/DISCLOSURE.md
author: Josh Hudson
license: MIT
homepage: https://github.com/hudsonwa/twin
manifest_version: 2
requires_hermes: ">=0.22.7"
platforms: [macos, linux, windows]
tags: [grok, twin, migration, import, sync, desktop]
provides_tools:
  - twin_status
  - twin_recent
  - twin_transcripts_search
provides_hooks:
  - pre_llm_call
  - on_session_start
  - on_session_end
capabilities: []
requires_env: []
emits: [synced, secrets_withheld, conflict, changed, created, removed, resolved, restored, instructions, approved,
        skipped, sent_to_grok, switched, switch_undone, mirror, helper, sync_error, demo, fleet, tasks, setup_export, setup]
external_dependencies:
  - name: botport
    install: "Open the Twins page in Hermes Desktop and press Connect my Grok bots. In the terminal: download release v0.2.1 for your computer from https://github.com/hudsonwa/botport/releases, then run hermes twin setup --file with the downloaded file. Hermes verifies botport before it is ever run."
    check: "botport version --json"
    optional: true
    note: "Without botport only the built-in sample twin works (See a sample first on the Twins page, or hermes twin demo)."
config_schema:
  sync_interval_seconds:
    type: int
    default: 60
    min: 5
    label: How often to check Grok (seconds)
    description: How often Hermes looks for changes to your Grok bots (file dates and sizes only). Minimum 5. A changed name or description does not wait for this; see the next setting.
  watch_grok_changes:
    type: bool
    default: true
    label: Notice name and description changes right away
    description: Hermes is woken when the Grok app saves its bot list and checks at once, so a new name or description reaches the twin in seconds. It looks at file names, dates and sizes only, never content, and uses no processor time while nothing changes. Off, such a change waits for the timed check.
  bots:
    type: list
    default: []
    label: Bots to list
    description: Only list Grok bots whose names match, for example "Acme*". Empty lists all your bots. Nothing is twinned until you pick it.
  botport_path:
    type: str
    default: ""
    label: Where botport is (advanced)
    description: Full path of botport, if you keep it somewhere special. Leave empty; the Twins page finds or asks for it.
  botport_release_tag:
    type: str
    default: ""
    label: botport release to accept (advanced)
    description: Leave empty to accept the botport release this plugin version expects (v0.2.1). To accept another one, give its release tag, like v0.2.0; botport is then verified against that release. Anything not shaped like v1.2.3 is refused.
  grok_app_dir:
    type: str
    default: ""
    label: Grok app folder (advanced)
    description: Only if the Grok desktop app keeps its data somewhere unusual. Leave empty for the standard place.
  grok_account:
    type: str
    default: ""
    label: Grok account (only if you use several)
    description: Only needed when the Grok app on this computer is signed in to more than one account. The 8-character label botport lists for your account (a label, never the account itself).
  inject_context:
    type: bool
    default: true
    label: Let chats know this is a twin
    description: Adds a short status note to each chat turn with a twin's Hermes bot ("your Grok twin", an internal id and whether it is up to date). Never names, never content.
  digest_to_grok:
    type: bool
    default: false
    label: Allow an activity digest to Grok
    description: Lets you turn on, twin by twin, a short digest (counts and times) that goes along when you send skill changes to Grok. Each twin still starts off. In this version only the sample shows it; real twins do not send it.
  digest_titles:
    type: bool
    default: false
    label: Include short titles in the digest
    description: A separate choice. Titles are shortened, and anything that looks like a password or key is masked; never message content.
  share_names_with_model:
    type: bool
    default: false
    label: Let the model see names
    description: Lets the model see the names of the bot, its routines, skills and connections when you ask it about a twin (plain characters only). Off, it only sees "your Grok twin". The per-turn note never carries names.
  share_port:
    type: int
    default: 18777
    min: 0
    label: Port for sharing with your other computers (advanced)
    description: The port the computer with the Grok app listens on while "Share my twins with my other computers" is on, and the port your other computers look for it on. Leave 18777 unless another program uses it; then set the same number on every computer.
  share_address:
    type: str
    default: ""
    label: Address to share on (advanced)
    description: Leave empty. Hermes then shares on this computer's Tailscale address when Tailscale is running, else on its home-network address. Only one of this computer's own private addresses is accepted; never a public one and never "all".
  machine_name:
    type: str
    default: ""
    label: This computer's name
    description: How this computer is called on the Twins page of your other computers and in each twin's note about where its copies are. Empty uses the computer's own name. Letters, digits, spaces, dots, dashes and underscores, at most 40.
  demo_profile:
    type: str
    default: ""
    label: Show the sample in this Hermes profile (advanced)
    description: Leave empty and the sample twin stays out of all your chats. Name a Hermes profile to let its chats see the sample; the note then says it is a sample with invented data.
