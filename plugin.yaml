name: grok-bot-twin
label: Grok Bot Twin
version: "0.3.0"
description: >-
  Give your Grok bots a twin in Hermes. A twin is a Hermes bot that follows a bot from the Grok desktop app;
  your Grok bot stays exactly as it is. Name and description changes reach the twin
  in seconds; instructions are something you copy yourself or import from the setup export the bot writes about itself; skills can travel through optional skill sync
  (a small sync bot in your own Grok account); routines and connections come over with that setup export (routines switched off, connections as names) or are an honest do-it-yourself list;
  a bot's Grok memory and Grok model setting are not copied. There is
  a choice when something changed in both places, earlier versions kept for undo, and anything that looks
  like a password or key not copied (this check can miss things). With sharing switched on, the same twins
  also appear on your other computers that run Hermes (macOS, Windows, Linux), linked once with a short code,
  and a twin can ask its copy on another computer to do something there (off until you switch it on).
  Unofficial; not affiliated with xAI. Disclosure: runs botport, a small free app that reads your bot list from Grok (you get
  it yourself from its release page; never downloaded or bundled; when you choose the downloaded file on the
  Twins page or with hermes twin setup --file, the plugin compares that one file with its list of release
  files and, on a match, copies it into its own data folder (a plain copy, without macOS's download mark:
  Gatekeeper does not vet it, the check against that list or the publisher's build record does); while botport is not verified yet the plugin
  looks for that download in your Downloads folder by its exact name only, listing and opening nothing; botport
  is verified, against that list or against the publisher's signed build record on GitHub, before it is ever run, with
  hermes twin setup --allow-unattested as a loud, recorded opt-out for local builds) as a subprocess with an argument list, plus gh (only for the GitHub check of botport;
  looked for on PATH, then in /opt/homebrew/bin and /usr/local/bin) and hermes
  (cron resume and pause on "Move routines to Hermes" and its undo; cron create --paused, once per routine, when you import a setup export, after one cron create --help, and cron pause at once for a routine that was not made switched off), each path-checked; the plugin checks whether the
  Grok app's folder exists and, once there is a real twin, watches that app's sand-client-persistence folder
  for the bot list being saved (file names, dates and sizes only; the plugin opens no Grok app file for reading); botport reads the Grok desktop app's bot list
  (id, name, description) and the selected bots' local transcript files (capped, parsed only for
  routine-change events), never login or credential files; writes under plugin-data/grok-bot-twin/ in the Hermes root and, as listed
  further on, in each twin's own Hermes profile (botport writes the twin profiles it manages); one background thread checks file metadata every
  sync_interval_seconds (default 60) while Hermes runs, and a second one sleeps until the Grok app saves its
  bot list and then wakes the first (no processor time while idle; watch_grok_changes turns it off); the plugin itself makes no network calls
  unless you use "Share my twins with my other computers": then, on the computer that shares, it listens on ONE
  address (its Tailscale address, else its private home-network address, and it stays on the one it first
  shared on while that works; never all interfaces, never a public one; TCP 18777) and hands each computer you
  linked with a one-time link code the list of your real twins
  (an opaque id, name, description, version, removals, and the names of your computers; nothing else, unless
  you switch on "Share my twins' skills with my other computers": then also the text files of each twin's skills, with
  password-like text replaced by a marker, never dot files, key files or files that are not text), and each twin's
  settings by a fixed list of names, item by item as switched (tool set and connector names, plain preferences,
  its instructions; the model's name only when switched on; never a key, token, sign-in or .env line; on the
  computer that shares, a short-lived thread looks at the dates of each twin's config.yaml and SOUL.md every 3 seconds
  for 3 minutes after a linked computer that takes settings last looked in), and
  on a linked computer it makes outgoing requests to that one address only (when the code's address cannot be
  reached, the link sheet offers the computers Hermes Desktop already knows, by name, read from the Desktop's own
  list) and keeps one Hermes bot per twin
  (plain HTTP, every request and answer signed with a per-computer key, and no key or code ever sent between computers:
  encrypted by Tailscale on Tailscale, readable but not forgeable on a plain home network); one more background thread on each side while that is on, asleep until something changes;
  only for a twin whose memory you switch on (off for every twin; on both computers), the notes in that twin's two Hermes memory files (memories/MEMORY.md, memories/USER.md) are merged between those computers,
  encrypted from one to the other with keys made from the link (never readable on the network, never logged), a note that looks like a password or key never leaving its computer,
  with the files as they were kept on each computer to put back and "Forget on this computer" to take out what came from elsewhere,
  and one more background thread on a linked computer while a twin's memory is on (file dates every 3 seconds, one short request every 15); no
  telemetry (the optional activity digest, off by default per twin, goes to your own Grok bot, which runs on
  xAI's service; in this version only the sample shows it, real twins do not send it); in a twin's own Hermes profile the plugin reads SOUL.md and config.yaml (and, only to show
  an earlier version of the name or description, the copies botport keeps there) and writes two
  things: the instructions you paste on the Twins page or import from a setup export (its own marked block in SOUL.md, never sent to Grok; the lists of memories and of facts about you in such a file are never looked into or stored)
  and, for a new twin without a model, your default model settings (ids and provider names only); it also adds
  a four-line note saying which computer this copy is on (a marked block in SOUL.md) and switches itself on in
  the twin's own Hermes bot (plugins.enabled in that bot's config.yaml plus a marked copy of its own installed
  folder in that bot's plugins folder), both undone when twinning stops; on a linked computer it makes each
  mirrored twin's Hermes profile (SOUL.md, config.yaml, profile.yaml, that copy) and, when the twin is removed
  or the computer unlinked, moves the profile into its own data folder for 30 days and leaves one small note
  of its own where Hermes notes bots that are gone (profiles/.deleted/NAME, so a running Hermes neither lists
  nor re-makes that bot; taken away again when the twin returns or the 30 days are over); when sharing cannot
  start because another program holds its port, the computer that shares asks the system for that program's
  name (lsof or ss from fixed system folders; on Windows netstat.exe and tasklist.exe from the system folder;
  shown on this computer only, never stored or sent);
  with Routines switched on (off until you do) the computer that shares also sends each twin's prompt routines
  (name, schedule, prompt after the same password-and-key check, skill names; never scripts, outputs, delivery
  targets or model settings) to your linked computers inside the same signed calls, and each computer then
  changes the twins' own Hermes job files (profiles/NAME/cron/jobs.json, under Hermes' own lock for that file):
  paused copies everywhere, each routine switched on on exactly one computer, and on a linked computer only
  after you allowed routines to run there; one more background thread while Routines is on (a look at the job
  files' dates every 30 seconds);
  no account credentials; botport stores one local pass per twin (a small owner-only key file)
  that signs its snapshots and, with skill sync on, authenticates what travels (a copy then lives in the
  sync bot's chat), replaced with hermes twin skill-sync --new-pass and deleted by hermes twin remove;
  only when you turn skill sync on, the plugin makes a set-up folder in its own data folder for you to attach
  in the sync bot's chat (the sync bot's instructions, a shell script the sync bot runs in its own box in Grok
  and the plugin never runs on this computer, a list of your twins signed with an inbox pass the plugin makes
  itself, a copy of each twin's pass as a file, never shown, and botport for that box: your own download, looked
  for in your Downloads folder under its exact name (or with " (1)" to " (9)" before .tar.gz), read to work out
  its SHA-256 and copied only when it matches the plugin's list of release files), writes that signed list and, for a twin added later or a replaced pass, a copy of the twin's
  pass as a file into the shared folder you chose (until the sync bot has taken it; the plugin deletes its own copy there afterwards, and on turning skill
  sync off), and reads one small file
  there that the script writes on every run (when it last ran and which botport it runs; data of known shapes
  only); removing Grok Bot Twin leaves a signed list there that names no twin; every run of the sync bot's routine spends your Grok credit;
  on Windows the background helper described next is one scheduled task of your own account (least privilege,
  no stored password, never SYSTEM), set up and removed with schtasks.exe, whoami.exe /user and, when the helper
  does not stop by itself, taskkill.exe by process id, all three run from the Windows system folder, and there
  the plugin also asks Windows who owns its own installed folder (read only) so that it can say when an install
  made from an administrator window is closed to your own programs;
  on a computer that follows another one you may turn on a background helper (hermes twin background on; off by
  default): one systemd user unit on Linux or one launchd agent on macOS (it starts through /bin/sh -c with one fixed
  line, the command passed as separate arguments), the only file the plugin adds outside
  the Hermes folder and the skill sync folder you chose, set up and removed with systemctl --user or launchctl run from fixed system folders, running
  hermes twin fleet run as you (never root; no listening socket on a linked computer) and deleted by hermes twin background off, by
  unlinking the computer or by removing the plugin's data; on Windows the helper is one scheduled task of your
  own account instead (no administrator rights, least privilege, never SYSTEM; set up and removed with
  schtasks.exe, with whoami.exe /user for your account's own id and taskkill.exe by process id when the helper
  does not stop by itself, all three from the Windows system folder), which runs hermes twin background run,
  the same loop, without a window (through a small launcher the task runs with Windows' own wscript.exe);
  hermes twin uninstall (or Remove Grok Bot Twin on the Twins page) deletes all of the plugin's data, on a
  linked computer including the Hermes bots it kept for 30 days after a removal;
  the Twins page also keeps a few notes of its own in Hermes Desktop's storage, outside that folder (boxes you
  ticked, the skill sync guide with the sync bot's texts and where the set-up folder is, never the pass
  itself, and the profile your twins are looked after in), cleared by Stop twinning and Remove Grok Bot Twin on
  that page (the terminal commands cannot reach that storage).
  Requests between your computers (off by default): only on a computer where you switch on "Let my other
  computers ask this one to do things" (one switch per computer), the plugin also fetches, over the link above
  and with the same per-computer key, requests your other linked computers send ("do X on Surface", the
  twin_ask_machine tool or hermes twin ask), runs each as ONE ordinary chat turn of the twin's own Hermes bot by
  using this computer's own Hermes (attached to the Hermes that is already running through Hermes' own client,
  by the small program twin/turn_bridge.py; else python -m tui_gateway.entry, Hermes' interface for programs; else
  hermes -p BOT chat -Q --query-file - with the request on standard input; no flag or variable that changes this
  computer's approval rules), where a step that needs approval waits for YOU on that computer (it shows the
  step; you answer once or deny there; no other computer can answer, and unanswered means not done; on that
  computer only you may instead choose "Let my own linked computers approve", which shows the step to the one
  computer that asked and takes its signed answer for that one step, or "Only safe requests", which refuses
  such steps at once), sends back
  only the twin's answer (password-like text masked, capped; under that second choice also the text of the
  step that waits), and keeps a log of every request on both
  computers (2,000 characters a request, 6 a minute and 40 an hour; one more background thread while it is on;
  switching it off stops a running request, on Windows with taskkill.exe by process id from the system folder,
  where a program that request had already started can run on to its own end).
  Two skills ship with the plugin: set-up-grok-bot-twin, a text file that walks you through hermes twin setup in
  a chat, and finish-twins-in-grok, a text file Hermes follows when you choose "Let Hermes do the Grok part".
  While the plugin is on, the model sees each skill's name and one line about it, and its text when you
  or the model ask for it; they hold steps and rules only and nothing of yours. hermes twin setup --check and --plan
  change nothing and never run botport; a run you said yes to may take the botport download it found in your
  Downloads folder by its exact name (the same as Use it on the Twins page).
  After you twin several bots, the sheet for them can watch your Downloads folder for their setup exports (only
  after Do all ticked now, while that sheet is open, at most 15 minutes): it lists that one folder and reads new
  .json, .txt or .md files up to 2 MB, imports what is a grok-bot-export for a ticked twin (memories and facts
  about you left out) and keeps only digests of the files it used. It can also set the model you chose in each
  ticked twin's config.yaml. The pre_tool_call hook does nothing unless you start "Let Hermes do the Grok part";
  then, for 30 minutes at most, it makes Hermes ask before every computer_use step and refuses anything outside
  the Grok app, the ticked bots' chats and the request text.
author: Josh Hudson
license: MIT
homepage: https://github.com/hudsonwa/twin
manifest_version: 2
requires_hermes: ">=0.22.7"
platforms: [macos, linux, windows]
tags: [grok, twin, migration, import, sync, desktop]
provides_tools:
  - twin_status
  - twin_recent
  - twin_ask_machine
provides_hooks:
  - pre_llm_call
  - on_session_start
  - on_session_end
  - pre_tool_call
capabilities: []
requires_env: []
emits: [synced, secrets_withheld, conflict, changed, created, removed, resolved, restored, instructions, approved,
        skipped, sent_to_grok, switched, switch_undone, mirror, helper, sync_error, demo, fleet, tasks, setup_export, setup]
external_dependencies:
  - name: botport
    install: "Open the Twins page in Hermes Desktop and press Connect my Grok bots. In the terminal: download release v0.2.1 for your computer from https://github.com/hudsonwa/botport/releases, then run hermes twin setup --file with the downloaded file. Hermes verifies botport before it is ever run."
    check: "botport version --json"
    optional: true
    note: "Without botport only the built-in sample twin works (See a sample first on the Twins page, or hermes twin demo)."
config_schema:
  sync_interval_seconds:
    type: int
    default: 60
    min: 5
    label: How often to check Grok (seconds)
    description: How often Hermes looks for changes to your Grok bots (file dates and sizes only). Minimum 5. A changed name or description does not wait for this; see the next setting.
  watch_grok_changes:
    type: bool
    default: true
    label: Notice name and description changes right away
    description: Hermes is woken when the Grok app saves its bot list and checks at once, so a new name or description reaches the twin in seconds. It looks at file names, dates and sizes only, never content, and uses no processor time while nothing changes. Off, such a change waits for the timed check.
  bots:
    type: list
    default: []
    label: Bots to list
    description: Only list Grok bots whose names match, for example "Acme*". Empty lists all your bots. Nothing is twinned until you pick it.
  botport_path:
    type: str
    default: ""
    label: Where botport is (advanced)
    description: Full path of botport, if you keep it somewhere special. Leave empty; the Twins page finds or asks for it.
  botport_release_tag:
    type: str
    default: ""
    label: botport release to accept (advanced)
    description: Leave empty to accept the botport release this plugin version expects (v0.2.1). To accept another one, give its release tag, like v0.2.0; botport is then verified against that release. Anything not shaped like v1.2.3 is refused.
  grok_app_dir:
    type: str
    default: ""
    label: Grok app folder (advanced)
    description: Only if the Grok desktop app keeps its data somewhere unusual. Leave empty for the standard place.
  grok_account:
    type: str
    default: ""
    label: Grok account (only if you use several)
    description: Only needed when the Grok app on this computer is signed in to more than one account. The 8-character label botport lists for your account (a label, never the account itself).
  inject_context:
    type: bool
    default: true
    label: Let chats know this is a twin
    description: Adds a short status note to each chat turn with a twin's Hermes bot ("your Grok twin", an internal id and whether it is up to date). Never names, never content.
  digest_to_grok:
    type: bool
    default: false
    label: Allow an activity digest to Grok
    description: Lets you turn on, twin by twin, a short digest (counts and times) that goes along when you send skill changes to Grok. Each twin still starts off. In this version only the sample shows it; real twins do not send it.
  digest_titles:
    type: bool
    default: false
    label: Include short titles in the digest
    description: A separate choice. Titles are shortened, and anything that looks like a password or key is masked; never message content.
  share_names_with_model:
    type: bool
    default: false
    label: Let the model see names
    description: Lets the model see the names of the bot, its routines, skills and connections when you ask it about a twin (plain characters only). Off, it only sees "your Grok twin". The per-turn note never carries names.
  share_port:
    type: int
    default: 18777
    min: 0
    label: Port for sharing with your other computers (advanced)
    description: The port the computer with the Grok app listens on while "Share my twins with my other computers" is on, and the port your other computers look for it on. Leave 18777 unless another program uses it; then set the same number on every computer.
  share_address:
    type: str
    default: ""
    label: Address to share on (advanced)
    description: Leave empty. Hermes then shares on this computer's Tailscale address when Tailscale is running, else on its home-network address. Only one of this computer's own private addresses is accepted; never a public one and never "all".
  machine_name:
    type: str
    default: ""
    label: This computer's name
    description: How this computer is called on the Twins page of your other computers and in each twin's note about where its copies are. Empty uses the computer's own name. Letters, digits, spaces, dots, dashes and underscores, at most 40.
  demo_profile:
    type: str
    default: ""
    label: Show the sample in this Hermes profile (advanced)
    description: Leave empty and the sample twin stays out of all your chats. Name a Hermes profile to let its chats see the sample; the note then says it is a sample with invented data.
